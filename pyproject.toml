[project]
name = "daffodil-deedguard"
version = "0.1.0"
description = "Synthetic, tamper-evident land deed registry demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "cryptography>=43.0",
  "qrcode[pil]>=8.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
